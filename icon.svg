<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3562FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Base background (PWA maskable safe zone is central 60%) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner White Calendar Card -->
  <rect x="106" y="106" width="300" height="300" rx="48" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Calendar Header Strip -->
  <path d="M106 106h300v70H106z" fill="#4F46E5" rx="12" />
  <!-- Smooth bottom corners for the header strip to fit inside the parent rounded rect -->
  <rect x="106" y="146" width="300" height="30" fill="#4F46E5" />
  
  <!-- Calendar Binder Rings -->
  <rect x="166" y="76" width="24" height="60" rx="12" fill="#E2E8F0" />
  <rect x="322" y="76" width="24" height="60" rx="12" fill="#E2E8F0" />
  
  <!-- Large "3" and "W" in calendar style -->
  <text x="256" y="325" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="144" fill="#1E293B" text-anchor="middle">3</text>
  <text x="256" y="375" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" fill="#3562FF" letter-spacing="4" text-anchor="middle">WEEKS</text>
</svg>
